<svg xmlns="http://www.w3.org/2000/svg" width="940" height="650" viewBox="0 0 940 650">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d5a7a"/>
      <stop offset="40%" stop-color="#1a8aaa"/>
      <stop offset="100%" stop-color="#0a6a8a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a9aaa"/>
      <stop offset="100%" stop-color="#0a4a6a"/>
    </linearGradient>
    <pattern id="blocks" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#1a8aaa"/>
      <rect width="38" height="38" x="1" y="1" fill="#2aaabb" rx="2"/>
      <rect width="36" height="36" x="2" y="2" fill="#3abbcc" rx="1" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="940" height="400" fill="url(#sky)"/>
  <rect width="940" height="250" y="400" fill="url(#ground)"/>
  <rect width="940" height="250" y="400" fill="url(#blocks)" opacity="0.3"/>
  <circle cx="750" cy="100" r="40" fill="#5acdde" opacity="0.3"/>
  <circle cx="150" cy="200" r="30" fill="#4abcd" opacity="0.25"/>
  <polygon points="200,400 300,290 400,400" fill="#0a5a7a" opacity="0.5"/>
  <polygon points="550,400 700,270 850,400" fill="#0a5a7a" opacity="0.4"/>
  <rect x="400" y="350" width="60" height="50" fill="#3abbcc" opacity="0.3" rx="2"/>
  <rect x="480" y="330" width="50" height="70" fill="#2aaabb" opacity="0.3" rx="2"/>
</svg>
